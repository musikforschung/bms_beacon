# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Dieses Action checkt den gesamten Repo-Inhalt in das Root-Verzeichnis aus
        
      # NEUER SCHRITT: Dateien aus dmp in das Root-Verzeichnis kopieren
      - name: Prepare files from dmp folder
        run: |
          mkdir -p output_dir
          cp -r dmp/* output_dir/
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Wir laden jetzt den Inhalt aus output_dir hoch
          path: './output_dir'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
